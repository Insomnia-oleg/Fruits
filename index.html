<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карточки товаров</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>📦 Наши товары</h1>

  <!-- Кнопка добавления товара -->
  <div style="text-align: center; margin-bottom: 20px;">
    <button id="addProductBtn" class="add-btn">➕ Добавить товар</button>
  </div>

  <div class="catalog" id="catalog"></div>

  <!-- Модалка для добавления товара -->
  <div class="modal-overlay" id="addProductModal">
    <div class="modal">
      <h2>Новый товар</h2>
      <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
        <input type="text" id="newProductName" placeholder="Название товара" />
        <input type="text" id="newProductImage" placeholder="Ссылка на картинку (необязательно)" />
      </div>
      <button id="saveProductBtn" class="modal-close-btn" style="background: #28a745;">Создать</button>
      <button id="cancelProductBtn" class="modal-close-btn" style="background: #6c757d; margin-top: 10px;">Отмена</button>
    </div>
  </div>

  <!-- Модалка для просмотра товара -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Товар</h2>
      <div class="accounts-container" id="accountsContainer"></div>
      <button id="addAccountBtn" class="add-account-btn" style="width: 100%; margin-bottom: 15px;">➕ Добавить аккаунт</button>
      <button class="modal-close-btn" id="modalCloseBtn">Закрыть</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

      apiKey: "AIzaSyCCUpgNGhSse3zhyY38S6v4DZQCvQ3X8Ik",
      authDomain: "blox-fruit-ef97a.firebaseapp.com",
      databaseURL: "https://blox-fruit-ef97a-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "blox-fruit-ef97a",
      storageBucket: "blox-fruit-ef97a.firebasestorage.app",
      messagingSenderId: "984744454694",
      appId: "1:984744454694:web:389579df66de11d84fd4e7",
      measurementId: "G-18XMKLMFXW"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
  <script src="script.js"></script>
</body>
</html>
